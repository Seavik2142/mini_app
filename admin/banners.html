<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hero Banners — Mini App Admin">

  <link rel="stylesheet" href="assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <aside class="admin-sidebar" id="adminSidebar" aria-label="Main navigation">
      <div class="sidebar-header">
        <a class="brand-mark" href="index.html" aria-label="Mini App Admin">
          <span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span>
          <span class="brand-copy">
            <span class="brand-title">Mini App</span>
            <span class="brand-subtitle">Admin Panel</span>
          </span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link" href="index.html">
          <span class="nav-icon"><i class="bi bi-speedometer2"></i></span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a class="nav-link" href="products.html">
          <span class="nav-icon"><i class="bi bi-box-seam"></i></span>
          <span class="nav-text">Products Catalog</span>
        </a>
        <a class="nav-link active" href="banners.html" aria-current="page">
          <span class="nav-icon"><i class="bi bi-images"></i></span>
          <span class="nav-text">Hero Banners</span>
        </a>
        <a class="nav-link" href="promos.html">
          <span class="nav-icon"><i class="bi bi-ticket-perforated"></i></span>
          <span class="nav-text">Promo Codes</span>
        </a>
        <a class="nav-link" href="users.html">
          <span class="nav-icon"><i class="bi bi-people"></i></span>
          <span class="nav-text">Users</span>
        </a>
        <a class="nav-link" href="payments.html">
          <span class="nav-icon"><i class="bi bi-credit-card"></i></span>
          <span class="nav-text">Payment History</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span class="sidebar-footer-text">System running smoothly</span>
      </div>
    </aside>

    <div class="admin-main">
      <nav class="navbar admin-navbar navbar-expand bg-white">
        <div class="container-fluid px-3 px-lg-4">
          <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-controls="adminSidebar" aria-expanded="true" aria-label="Toggle sidebar">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="navbar-actions ms-auto">
            <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
              <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </nav>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">

          <!-- Page Heading -->
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-images" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Content</p>
                <h1 class="h3 mb-1">Hero Banners</h1>
                <p class="text-muted mb-0">Manage storefront promo banners, titles, descriptions, and badge text.</p>
              </div>
            </div>
          </div>

          <!-- Banners Grid -->
          <div class="row g-4 mt-1" id="bannersGrid">
            <!-- Rendered by JS -->
          </div>

        </div>
      </main>

      <footer class="admin-footer">
        <div class="container-fluid px-3 px-lg-4">
          <span>Mini App Admin Panel &copy; 2026</span>
        </div>
      </footer>
    </div>
  </div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/config.js"></script>
  <script>
    let banners = JSON.parse(localStorage.getItem('mini_app_banners')) || [
      { id: 1, badge: "Telegram Premium 🔑", title: "Instant Telegram Keys", desc: "Get 1-year Telegram Premium activation voucher keys with instant delivery!", tag: "⚡ INSTANT ACCESS", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80" },
      { id: 2, badge: "Gaming & Gift Cards 🎮", title: "Steam Wallet Cards", desc: "Redeem $50 global Steam keys directly to your account balance!", tag: "🔥 POPULAR", image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80" },
      { id: 3, badge: "Software & VPN 🛡️", title: "ExpressVPN Pro 1-Year", desc: "High-speed encrypted VPN serial keys with multi-device support.", tag: "💳 KHQR Supported", image: "https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=600&q=80" }
    ];

    function renderBanners() {
      const grid = document.getElementById('bannersGrid');
      grid.innerHTML = '';
      banners.forEach(b => {
        grid.innerHTML += `
          <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0">
              <img src="${b.image}" class="card-img-top" style="height: 160px; object-fit: cover; border-top-left-radius: 8px; border-top-right-radius: 8px;">
              <div class="card-body">
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">BADGE TEXT</label>
                  <input type="text" class="form-control form-control-sm" value="${escHtml(b.badge)}" onchange="updateBanner(${b.id}, 'badge', this.value)">
                </div>
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">TITLE</label>
                  <input type="text" class="form-control form-control-sm fw-bold" value="${escHtml(b.title)}" onchange="updateBanner(${b.id}, 'title', this.value)">
                </div>
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">DESCRIPTION</label>
                  <textarea class="form-control form-control-sm" rows="2" onchange="updateBanner(${b.id}, 'desc', this.value)">${escHtml(b.desc)}</textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">IMAGE URL</label>
                  <input type="text" class="form-control form-control-sm" value="${escHtml(b.image)}" onchange="updateBanner(${b.id}, 'image', this.value)">
                </div>
                <div class="d-flex justify-content-end align-items-center">
                  <span class="badge bg-success">Auto-Saved</span>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function updateBanner(id, key, val) {
      banners = banners.map(b => b.id === id ? { ...b, [key]: val } : b);
      localStorage.setItem('mini_app_banners', JSON.stringify(banners));
      showToast('Banner saved successfully');
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', renderBanners);
  </script>
</body>
</html>
