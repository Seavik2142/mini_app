<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hero Image Banners — Mini App Admin">
  <title>Hero Banners | Mini App Admin</title>

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .banner-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .banner-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08) !important;
    }
    .banner-img-preview {
      height: 180px;
      object-fit: cover;
      border-top-left-radius: var(--bs-card-inner-border-radius, 8px);
      border-top-right-radius: var(--bs-card-inner-border-radius, 8px);
      background-color: #f1f5f9;
    }
  </style>
</head>

<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <aside class="admin-sidebar" id="adminSidebar" aria-label="Main navigation">
      <div class="sidebar-header">
        <a class="brand-mark" href="index.html" aria-label="Mini App Admin">
          <span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span>
          <span class="brand-copy">
            <span class="brand-title">Mini App</span>
            <span class="brand-subtitle">Admin Panel</span>
          </span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link" href="index.html">
          <span class="nav-icon"><i class="bi bi-speedometer2"></i></span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a class="nav-link" href="products.html">
          <span class="nav-icon"><i class="bi bi-box-seam"></i></span>
          <span class="nav-text">Products Catalog</span>
        </a>
        <a class="nav-link active" href="banners.html" aria-current="page">
          <span class="nav-icon"><i class="bi bi-images"></i></span>
          <span class="nav-text">Hero Banners</span>
        </a>
        <a class="nav-link" href="promos.html">
          <span class="nav-icon"><i class="bi bi-ticket-perforated"></i></span>
          <span class="nav-text">Promo Codes</span>
        </a>
        <a class="nav-link" href="users.html">
          <span class="nav-icon"><i class="bi bi-people"></i></span>
          <span class="nav-text">Users</span>
        </a>
        <a class="nav-link" href="payments.html">
          <span class="nav-icon"><i class="bi bi-credit-card"></i></span>
          <span class="nav-text">Payment History</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span class="sidebar-footer-text">System running smoothly</span>
      </div>
    </aside>

    <div class="admin-main">
      <nav class="navbar admin-navbar navbar-expand bg-white">
        <div class="container-fluid px-3 px-lg-4">
          <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-controls="adminSidebar" aria-expanded="true" aria-label="Toggle sidebar">
            <span></span><span></span><span></span>
          </button>
          <div class="navbar-actions ms-auto">
            <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
              <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </nav>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">

          <!-- Page Heading -->
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-images" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Content Management</p>
                <h1 class="h3 mb-1">Hero Image Banners</h1>
                <p class="text-muted mb-0">Control the storefront carousel banner images, titles, descriptions, and promo badges.</p>
              </div>
            </div>
            <div class="heading-actions">
              <button class="btn btn-primary btn-sm" onclick="openAddBannerModal()">
                <i class="bi bi-plus-lg me-1"></i> Add New Image Banner
              </button>
            </div>
          </div>

          <!-- Banners Grid -->
          <div class="row g-4 mt-1" id="bannersGrid">
            <!-- Populated by JS -->
          </div>

        </div>
      </main>

      <footer class="admin-footer">
        <div class="container-fluid px-3 px-lg-4">
          <span>Mini App Admin Panel &copy; 2026</span>
        </div>
      </footer>
    </div>
  </div>

  <!-- Add/Edit Banner Modal -->
  <div class="modal fade" id="bannerModal" tabindex="-1" aria-labelledby="bannerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="bannerModalLabel">Add Hero Banner</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="bannerForm" onsubmit="saveBanner(event)">
            <input type="hidden" id="bannerId">

            <div class="mb-3">
              <label class="form-label text-muted small fw-semibold">IMAGE BANNER URL <span class="text-danger">*</span></label>
              <input type="url" id="bannerImageUrl" class="form-control" placeholder="https://images.unsplash.com/photo-..." oninput="updateModalImagePreview(this.value)" required>
              <div class="mt-2 text-center" id="modalImagePreviewContainer" style="display:none;">
                <img id="modalImagePreview" src="" class="rounded border" style="max-height: 160px; width: 100%; object-fit: cover;">
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label text-muted small fw-semibold">BANNER TITLE <span class="text-danger">*</span></label>
                <input type="text" id="bannerTitle" class="form-control fw-bold" placeholder="e.g. ChatGPT Plus Digital Keys" required>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-semibold">BADGE / TAG TEXT</label>
                <input type="text" id="bannerBadge" class="form-control" placeholder="e.g. 🤖 ChatGPT Plus & GPT-4o">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted small fw-semibold">DESCRIPTION</label>
              <textarea id="bannerDesc" class="form-control" rows="3" placeholder="Short promo description displayed on the banner slide..."></textarea>
            </div>

            <div class="modal-footer px-0 pb-0">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-check-lg me-1"></i> Save Image Banner</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/config.js"></script>
  <script>
    let editingBannerId = null;
    let banners = [];

    async function loadBanners() {
      try {
        const res = await apiFetch(API.banners);
        banners = res.data || res || [];
      } catch (e) {
        console.warn('API banners fetch fallback to localStorage:', e);
        banners = JSON.parse(localStorage.getItem('mini_app_banners')) || [];
      }
      renderBanners();
    }

    function renderBanners() {
      const grid = document.getElementById('bannersGrid');
      grid.innerHTML = '';

      if (banners.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5 text-muted">
            <i class="bi bi-images fs-1 d-block mb-2"></i>
            <p>No image banners added yet. Click "Add New Image Banner" to create one.</p>
          </div>
        `;
        return;
      }

      banners.forEach((b, index) => {
        grid.innerHTML += `
          <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0 banner-card">
              <div class="position-relative">
                <img src="${escHtml(b.image)}" class="card-img-top banner-img-preview" alt="${escHtml(b.title)}" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'">
                <span class="position-absolute top-0 start-0 m-2 badge bg-dark opacity-75">Slide #${index + 1}</span>
              </div>
              <div class="card-body d-flex flex-column justify-content-between">
                <div>
                  <div class="mb-2">
                    <span class="badge bg-primary-subtle text-primary fw-semibold">${escHtml(b.badge || 'Banner')}</span>
                  </div>
                  <h5 class="card-title fw-bold text-body mb-2">${escHtml(b.title)}</h5>
                  <p class="card-text text-muted small leading-normal mb-3">${escHtml(b.desc)}</p>
                </div>
                <div class="pt-3 border-top d-flex align-items-center justify-content-between">
                  <small class="text-muted text-truncate" style="max-width: 140px;" title="${escHtml(b.image)}">📷 Image URL</small>
                  <div>
                    <button class="btn btn-light btn-sm me-1" onclick="openEditBannerModal(${b.id})">
                      <i class="bi bi-pencil me-1"></i> Edit
                    </button>
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteBanner(${b.id})">
                      <i class="bi bi-trash"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openAddBannerModal() {
      editingBannerId = null;
      document.getElementById('bannerForm').reset();
      document.getElementById('bannerId').value = '';
      document.getElementById('bannerModalLabel').textContent = 'Add New Image Banner';
      document.getElementById('modalImagePreviewContainer').style.display = 'none';

      const modalEl = document.getElementById('bannerModal');
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
    }

    function openEditBannerModal(id) {
      const banner = banners.find(b => b.id === id);
      if (!banner) return;

      editingBannerId = banner.id;
      document.getElementById('bannerModalLabel').textContent = 'Edit Image Banner';
      document.getElementById('bannerId').value = banner.id;
      document.getElementById('bannerImageUrl').value = banner.image;
      document.getElementById('bannerTitle').value = banner.title;
      document.getElementById('bannerBadge').value = banner.badge || '';
      document.getElementById('bannerDesc').value = banner.desc || '';

      updateModalImagePreview(banner.image);

      const modalEl = document.getElementById('bannerModal');
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
    }

    function updateModalImagePreview(url) {
      const container = document.getElementById('modalImagePreviewContainer');
      const img = document.getElementById('modalImagePreview');
      if (url && url.trim().startsWith('http')) {
        img.src = url;
        container.style.display = 'block';
      } else {
        container.style.display = 'none';
      }
    }

    async function saveBanner(e) {
      e.preventDefault();
      const image = document.getElementById('bannerImageUrl').value.trim();
      const title = document.getElementById('bannerTitle').value.trim();
      const badge = document.getElementById('bannerBadge').value.trim();
      const desc = document.getElementById('bannerDesc').value.trim();

      if (!image || !title) {
        showToast('Image URL and Title are required', 'error');
        return;
      }

      const body = { image, title, badge: badge || 'PROMO', desc, tag: '⚡ SPECIAL OFFER' };

      try {
        if (editingBannerId) {
          await apiFetch(`${API.banners}/${editingBannerId}`, { method: 'PATCH', body: JSON.stringify(body) });
          showToast('Image banner updated successfully!');
        } else {
          await apiFetch(API.banners, { method: 'POST', body: JSON.stringify(body) });
          showToast('New image banner added!');
        }
      } catch (err) {
        console.warn('Banner API save error, updating local array:', err);
        if (editingBannerId) {
          banners = banners.map(b => b.id === editingBannerId ? { ...b, ...body } : b);
        } else {
          banners.push({ id: Date.now(), ...body });
        }
        localStorage.setItem('mini_app_banners', JSON.stringify(banners));
        showToast('Saved to local storage');
      }

      const modalEl = document.getElementById('bannerModal');
      const modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();
      loadBanners();
    }

    async function deleteBanner(id) {
      if (!confirm('Are you sure you want to delete this image banner?')) return;
      try {
        await apiFetch(`${API.banners}/${id}`, { method: 'DELETE' });
        showToast('Banner deleted', 'info');
      } catch (err) {
        banners = banners.filter(b => b.id !== id);
        localStorage.setItem('mini_app_banners', JSON.stringify(banners));
        showToast('Banner removed from local storage', 'info');
      }
      loadBanners();
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', loadBanners);
  </script>
</body>
</html>
