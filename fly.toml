# fly.toml — Fly.io app configuration for mini-app-server
# Deploy from: mini_app/ (project root) so Docker can access both server/ and admin/
app = "mini-app-server"
primary_region = "sin"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
